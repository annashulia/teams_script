  /1/api/telephony/logcallcomplete/245084a3370939011a636a2d0ee:
    post:
      summary: Post a Call Log (Async)
      operationId: post_a_call_log_async
      tags:
      - LeadSquared Async
      responses:
        '200':
          description: New Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    type: string
                    description: A message confirming that the request was accepted
                      successfully.
                  RequestID:
                    type: string
                    description: A unique identifier assigned to the submitted request.
                      Use this ID to track or check the status of the request.
              example:
                Status: Request accepted. Please use below request id to check the
                  status
                RequestID: 1b14ee89-881c-4a2a-8e0e-0d45310f8a70
      description: "Posts a call log to LeadSquared.\n\nThe API URL and post data\
        \ differ based on the installed LeadSquared telephony connector (Universal\
        \ Telephony Connector, Generic Telephony Connector, etc.) and the telephony\
        \ provider (Ozonetel, Super Receptionist, etc.).\n\n**Note:**\n\n- The [Exotel\
        \ telephony connector](https://in21.leadsquared.com/Apps/ConnectorDetail?connectorId=331fe5dd-ce0d-11e5-a199-22000aa4133b)\
        \ is not supported.\n    \n- We recommend integrating with LeadSquared through\
        \ the [Universal Telephony Connector](https://help.leadsquared.com/universal-connector/).\n\
        \    \n- The functionality is the same as the synchronous Call Log APIs.\n\
        \    \n- This API returns a `RequestId` parameter. This must be passed in\
        \ the [Status API](https://www.postman.com/leadsquaredapi/leadsquared-public-apis/request/uxipkwx/post-a-call-log-status-api?action=share&source=copy-link&creator=39502170&ctx=documentation)\
        \ to get the status of the request.\n    \n- To get metrics for this Async\
        \ API, see [Get Post Call Log Metrics API](https://www.postman.com/leadsquaredapi/leadsquared-public-apis/request/mw1zayw/get-post-call-log-metrics?action=share&source=copy-link&creator=39502170&ctx=documentation).\n\
        \    \n\nTo get the API URL and post data –\n\n1. In your account, navigate\
        \ to **Apps>Apps Marketplace**.\n    \n2. Search for and select the connector\
        \ (e.g., Universal Telephony Connector).\n    \n3. Click **Settings>Configure.**\n\
        \    \n4. On the configuration pop-up, click **Call Log API**.\n    \n\n<img\
        \ src=\"https://content.pstmn.io/6c69a289-566f-4823-b74b-92f8dbe07c9e/Y2FsbCBsb2cgYXBpLnBuZw==\"\
        >\n\n> **Note:** API host is different, see [Async API](https://apidocs.leadsquared.com/async-api/).\
        \ For example, if the current host is `https://telephony-in21.leadsquared.com`,\
        \ for Async, the host will be `https://asyncapi-in21.leadsquared.com`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                SourceNumber:
                  type: string
                  description: This is the source telephone number. In case of an
                    inbound call, the source phone number is the lead’s phone number.
                    In case of an outbound call, the source is the agent phone number.
                CallerSource:
                  type: string
                  description: "This parameter allows you to pass the caller source.\
                    \ For example, if the caller came through a newspaper advertisement,\
                    \ enter “Newspaper Advertisement” here.  \n\nYou can pass any\
                    \ string of maximum 50 characters.  \n\n> Note: If a new lead\
                    \ is being created through the call (lead Id is not passed), the\
                    \ caller source will update the lead source with the value that\
                    \ you pass here."
                DestinationNumber:
                  type: string
                  description: This is the destination telephone number. In case of
                    an inbound call, the destination phone number is the agent’s phone
                    number. In case of an outbound call, the destination number is
                    the Lead’s phone number.
                DisplayNumber:
                  type: string
                  description: This is the IVR number.
                StartTime:
                  type: string
                  description: The start time of the conversation in UTC (`YYYY-MM-DD
                    HH:MM:SS`)
                EndTime:
                  type: string
                  description: The end time of the conversation in UTC (`YYYY-MM-DD
                    HH:MM:SS`).
                CallDuration:
                  type: string
                  description: This is the duration of the call in second(s).
                Status:
                  type: string
                  description: This is the call status. This can be `Answered`, `Missed`,
                    and so on.
                CallNotes:
                  type: string
                  description: Notes posted that are related to the call.
                ResourceURL:
                  type: string
                  description: URL of the resource where the call log is posted.
                Direction:
                  type: string
                  description: This is the direction of the call. This can be inbound
                    or outbound.
                CallSessionId:
                  type: string
                  description: This is the unique Id of the call session.
                AgentName:
                  type: string
                  description: The name of the agent who made/received the call.
                LeadId:
                  type: string
                  description: This is the unique Id of a lead.
                UserId:
                  type: string
                  description: This is the unique Id of the LeadSquared user you want
                    to associate to the Lead. Use the Get Users API under User Management
                    to retrieve this value.
              required:
              - SourceNumber
              - DestinationNumber
              - Direction
            example:
              SourceNumber: '9611795983'
              DestinationNumber: '9611795980'
              DisplayNumber: '9020897874'
              StartTime: '2025-02-11 18:26:38'
              EndTime: '2025-02-11 18:26:38'
              CallDuration: '12'
              Status: Answered
              CallNotes: Enquired about product
              ResourceURL: https://webhook.site/c4caabf8-4c89-4a61-b922-af0bbb12c17b
              Direction: Inbound
              CallSessionId: 80673309211440070000
              AgentName: Mica
