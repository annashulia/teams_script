              example:
                RequestId: 3977a338-7896-4370-a286-417476a5380e
                TaskStatus:
                  TaskType: Activity Create
                  Status: Success
                  StatusReason: Request was successfully completed
                  TaskCurrentStep: null
                  TaskLastStep: In-Process-Queue
                  RequestBody: "{\r\n    \"RelatedProspectId\": \"6f2195dc-e36d-4074-9e2e-e40911c11c42\"\
                    ,\r\n    \"ActivityEvent\": 201,\r\n    \"ActivityNote\": \"Payment\"\
                    ,\r\n    \"ProcessFilesAsync\": true,\r\n    \"ActivityDateTime\"\
                    : \"2025-02-10 12:13:44\",\r\n    \"Fields\": [\r\n        {\r\
                    \n            \"SchemaName\": \"mx_Custom_1\",\r\n           \
                    \ \"Value\": \"20000\"\r\n        },\r\n        {\r\n        \
                    \    \"SchemaName\": \"mx_Custom_2\",\r\n            \"Value\"\
                    : \"UPF35B1\"\r\n        },\r\n        {\r\n            \"SchemaName\"\
                    : \"mx_Custom_3\",\r\n            \"Value\": \"Rupees\"\r\n  \
                    \      }\r\n    ]\r\n}"
                  Message: '{"Status":"Success","Message":{"Id":"9caf1345-9d4a-402b-9c1c-cb3e72e34da9","RelatedId":"6f2195dc-e36d-4074-9e2e-e40911c11c42"}}'
      description: 'Returns the status of the [async activity post request](https://www.postman.com/leadsquaredapi/leadsquared-public-apis/request/xcg7tdn/post-an-activity-on-a-lead?action=share&source=copy-link&creator=39502170&ctx=documentation).


        ## Response Parameters


        | **Parameter** | **Description** | **Data Type** |

        | --- | --- | --- |

