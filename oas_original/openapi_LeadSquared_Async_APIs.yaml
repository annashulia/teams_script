        \n**Note:**\n\n- Take a look at [synchronous Capture Opportunities API](https://www.postman.com/leadsquaredapi/leadsquared-public-apis/request/s6qk3z9/capture-opportunities?action=share&source=copy-link&creator=39502170&ctx=documentation)\
        \ for the functionality of the API and documentation on the payload.\n   \
        \ \n- This API returns a `RequestId` parameter. This must be passed in the\
        \ [Status API](https://www.postman.com/leadsquaredapi/leadsquared-public-apis/request/gg80gty/capture-opportunities-status-api?action=share&source=copy-link&creator=39502170&ctx=documentation)\
        \ to get the status of the request.\n    \n- To get metrics for this Async\
        \ API, see [Get Capture Opportunities Metrics API](https://www.postman.com/leadsquaredapi/leadsquared-public-apis/request/gg80gty/capture-opportunities-status-api?action=share&source=copy-link&creator=39502170&ctx=documentation)."
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                LeadDetails:
                  type: array
                  items:
                    type: object
                    properties:
                      Attribute:
                        type: string
                      Value:
                        type: string
                  description: "Array containing lead fields. These should be passed\
                    \ as attribute-value pairs.  \n  \n- You must pass at least 1\
                    \ unique field  \n  \n- It is mandatory to specify the SearchBy\
                    \ attribute in the JSON body.  \n  \n- If you pass ProspectID\
                    \ as the SearchBy criteria, pass an additional parameter `__UseUserDefinedGuid__`\
                    \ as `true`. This is useful if the GUID is generated from an external\
                    \ system.  \n  \n- Pass only unique fields here."
                Opportunity:
                  type: object
                  properties:
                    OpportunityEventCode:
                      type: integer
                      description: The opportunity event code.
                    UpdateEmptyFields:
                      type: boolean
                      description: If you pass the value as true, empty opportunity
                        fields in all opportunities passed will be updated with the
                        values present in the corresponding JSON fields.
                    OverwriteFields:
                      type: boolean
                      description: If you pass the value as true, the existing values
                        in all the opportunity fields passed in the JSON body will
                        be overwritten with the new values for duplicate opportunities.
                    DoNotPostDuplicateActivity:
                      type: boolean
                      description: If you pass the value as true, duplicate activities
                        will not get posted on the opportunity.
                    doNotChangeOwner:
                      type: boolean
                      description: If you pass the value as true, duplicate opportunities
                        that contain a new value in the Owner field are ignored, and
                        the opportunity owner remains the same.
                    OpportunityNote:
                      type: string
                      description: Notes (text) associated with the opportunity.
                    OpportunityDateTime:
                      type: string
                      description: Opportunity date and time is in the `yyyy-mm-dd
                        hh:mm:ss` format.
                    Fields:
                      type: array
                      items:
                        type: object
                        properties:
                          SchemaName:
                            type: string
                          Value:
                            type: string
                      description: Attribute-value pairs for the opportunity fields
                        you want to capture. You must pass the schema names of the
                        opportunity fields.
                  required:
                  - OpportunityEventCode
              required:
              - LeadDetails
            example:
              LeadDetails:
              - Attribute: SearchBy
                Value: EmailAddress
              - Attribute: EmailAddress
                Value: Sama@lsqq.in
              - Attribute: FirstName
                Value: Sam
              Opportunity:
                OpportunityEventCode: 12000
                UpdateEmptyFields: true
                OverwriteFields: false
                DoNotPostDuplicateActivity: true
                doNotChangeOwner: true
                OpportunityNote: test
                Fields:
                - SchemaName: Status
                  Value: Open
                - SchemaName: mx_Custom_2
                  Value: Need Analysis
                - SchemaName: Owner
                  Value: donaopp@mcn.christuniversity.in
                - SchemaName: mx_Custom_1
                  Value: Sam - Home Loan
