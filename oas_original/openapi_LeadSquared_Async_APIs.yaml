- name: LeadSquared Async APIs > LeadSquared Async
  tags:
  - LeadSquared Async
paths:
  /lead/capture:
    post:
      summary: Capture Leads (Async)
      operationId: capture_leads_async
      tags:
      - LeadSquared Async
      responses:
        '200':
          description: Update an existing Lead
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    type: string
                    description: A message confirming if the request was accepted
                      successfully.
                  RequestID:
                    type: string
                    description: A unique identifier assigned to the submitted request.
                      Use this ID to track or check the status of the request.
              example:
                Status: Request accepted. Please use below request id to check the
                  status
                RequestID: 96fe5d59-6e86-49be-8ead-f023208cad00
      description: "Captures leads from all sources.\n\n**Note:**\n\n- Take a look\
        \ at [synchronous Capture Leads](https://www.postman.com/leadsquaredapi/leadsquared-public-apis/request/iiy0bk3/capture-leads?action=share&source=copy-link&creator=39502170&ctx=documentation)\
        \ API for API funcationality and documentation on the payload.\n    \n- This\
        \ API returns a `RequestId` parameter. This must be passed in the [Status](https://www.postman.com/leadsquaredapi/leadsquared-public-apis/request/4j18ysc/capture-leads-status-api?action=share&source=copy-link&creator=39502170&ctx=documentation)\
        \ API to get the status of the request.\n    \n- To get metrics for this Async\
        \ API, see [Get Capture Leads Metrics API](https://www.postman.com/leadsquaredapi/leadsquared-public-apis/request/3winrhs/get-capture-leads-metrics?action=share&source=copy-link&creator=39502170&ctx=documentation)."
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  Attribute:
                    type: string
                    description: The schema name of the lead fields you want to update.
                      To retrieve the schema name use the Get Metadata API.
                  Value:
                    type: string
                    description: The new value of the lead field.
                required:
                - Attribute
                - Value
            example:
            - Attribute: ProspectID
              Value: 45b5fded-e696-45a6-9fbb-c6af6178229e
            - Attribute: FirstName
              Value: Bim
            - Attribute: LastName
              Value: Enders
            - Attribute: EmailAddress
              Value: bim.enders@lsq.com
            - Attribute: Phone
              Value: '98347532912'
            - Attribute: SearchBy
              Value: Phone
      security:
      - APIKey: []
        AccessKey: []
        SecretKey: []
  /lead/status:
    get:
      summary: Capture Leads Status API
      operationId: capture_leads_status_api
      tags:
      - LeadSquared Async
      responses:
        '200':
          description: New Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  RequestId:
                    type: string
                    description: ID of the request.
                  TaskStatus:
                    type: object
                    properties:
                      TaskType:
                        type: string
                        description: The task type related to the request (for example,
                          "Lead Capture").
                      Status:
                        type: string
                        description: Possible values are "In-Queue", "FAILURE", "ERROR",
                          or "Success".
                      StatusReason:
                        type: string
                        description: Provides the reason for the status. If successful,
                          "Request was successfully completed" is returned; otherwise,
                          the error reason is returned.
                      TaskCurrentStep:
                        type: string
                        nullable: true
                        description: The current step the request is in.
                      TaskLastStep:
                        type: string
                        description: The previous step completed by the request.
                      RequestBody:
                        type: string
                        description: The body passed in the Async API request.
                      Message:
                        type: string
                        description: If successful, the response data for the original
                          API request is returned; otherwise, null is returned.
              example:
                RequestId: 96fe5d59-6e86-49be-8ead-f023208cad00
                TaskStatus:
                  TaskType: Lead Capture
                  Status: Success
                  StatusReason: Request was successfully completed
                  TaskCurrentStep: null
                  TaskLastStep: In-Process-Queue
                  RequestBody: "[\r\n    {\r\n        \"Attribute\": \"FirstName\"\
                    ,\r\n        \"Value\": \"Diana\"\r\n    },\r\n    {\r\n     \
                    \   \"Attribute\": \"LastName\",\r\n        \"Value\": \"White\"\
                    \r\n    },\r\n    {\r\n        \"Attribute\": \"EmailAddress\"\
                    ,\r\n        \"Value\": \"diana.white@example.com\"\r\n    },\r\
                    \n    {\r\n        \"Attribute\": \"Phone\",\r\n        \"Value\"\
                    : \"9834753555\"\r\n    },\r\n    {\r\n        \"Attribute\":\
                    \ \"ProspectID\",\r\n        \"Value\": \"d1c4fa7b-f191-11ee-9566-020f15161885\"\
                    \r\n    },\r\n    {\r\n        \"Attribute\": \"SearchBy\",\r\n\
                    \        \"Value\": \"Email\"\r\n    }\r\n]"
                  Message: '{"Status":"Success","Message":{"Id":"bebf73eb-5bce-415b-aa91-8b428472f3c8","RelatedId":"d1c4fa7b-f191-11ee-9566-020f15161885","IsCreated":false}}'
      description: 'Returns the status of the [async lead capture](https://www.postman.com/leadsquaredapi/leadsquared-public-apis/request/mmzrfqx/capture-leads-async?action=share&source=copy-link&creator=39502170&ctx=documentation)
        request.


        ## Response Parameters


        | **Parameter** | **Description** | **Data Type** |

        | --- | --- | --- |

        | `RequestId` | ID of the request. | `String` |

        | `TaskType` | The task type related to the request. For example, “Lead Capture”.
        | `String` |

        | `Status` | Returned values are “In-Queue”, “FAILURE”, “ERROR”, “Success”.
        | `String` |

        | `StatusReason` | Text explaining the reason for the above status. If “Success”,
        then “Request was successfully completed” is returned; otherwise, error reason
        is returned. | `String` |

        | `TaskCurrentStep` | Current step the request is in. | `Enum` |

        | `TaskLastStep` | Previous step the request completed. | `Enum` |

        | `RequestBody` | The body that was passed in the Async API request. | `Object`
        |

        | `Message` | If successful, response data for the original API request is
        returned; otherwise null is returned. | `Object` |'
      parameters:
      - name: RequestID
        in: query
        required: true
        schema:
          type: string
        example: <string>
        description: 'Pass the RequestId value returned by the Capture Leads (Async)
          API. '
  /lead/metrics:
    get:
      summary: Get Capture Leads Metrics
      operationId: get_capture_leads_metrics
      tags:
      - LeadSquared Async
      responses:
        '200':
          description: Get Capture Leads Metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  PendingMessages:
                    type: integer
                    description: The approximate number of pending requests in the
                      queue.
                  MaxDelayInSeconds:
                    type: integer
                    description: The maximum delay (in seconds) for processing all
                      requests in the queue.
                  ProcessingRatePerMinute:
                    type: number
                    description: Number of requests being processed per minute (for
                      the previous 10 mins).
              example:
                PendingMessages: 1
                MaxDelayInSeconds: 0
                ProcessingRatePerMinute: 24.8
      description: "Returns the following metrics for the [Capture Leads Async API](https://www.postman.com/leadsquaredapi/leadsquared-public-apis/request/mmzrfqx/capture-leads-async?action=share&source=copy-link&creator=39502170&ctx=documentation) \
        \ –\n\n- `PendingMessages` – The approximate number of pending requests in\
        \ the queue.\n    \n- `MaxDelayInSeconds` – The maximum delay (in seconds)\
        \ for processing all requests in the queue.\n    \n- `ProcessingRatePerMinute`\
        \ – Number of requests being processed per minute (for the previous 10 mins)."
  /lead/update:
    post:
      summary: Update a Lead (Async)
      operationId: update_a_lead_async
      tags:
      - LeadSquared Async
      responses:
        '200':
          description: New Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    type: string
                    description: A message confirming if the request was accepted
                      successfully.
                  RequestID:
                    type: string
                    description: A unique identifier assigned to the submitted request.
                      Use this ID to track or check the status of the request.
              example:
                Status: Request accepted. Please use below request id to check the
                  status
                RequestID: 2b007bef-a9e9-4a89-8af1-7fd2ea2b8ad2
      description: "Updates an existing lead in your account.\n\n**Note:**\n\n- Take\
        \ a look at [synchronous Update a Lead API](https://www.postman.com/leadsquaredapi/leadsquared-public-apis/request/sab2t0p/update-a-lead?action=share&source=copy-link&creator=39502170&ctx=documentation)\
        \ for funcationality of the API and documentation on the payload.\n    \n\
        - This API returns a `RequestId` parameter in the response. This must be passed\
        \ in the [Status API](https://www.postman.com/leadsquaredapi/leadsquared-public-apis/request/09hi4cm/update-a-lead-status-api?action=share&source=copy-link&creator=39502170&ctx=documentation)\
        \ to get the status of the request.\n    \n- To get metrics for this Async\
        \ API, see [Get Update Lead Metrics API](https://www.postman.com/leadsquaredapi/leadsquared-public-apis/request/wm0x1cc/get-update-lead-metrics?action=share&source=copy-link&creator=39502170&ctx=documentation)."
      parameters:
      - name: leadId
        in: query
        required: true
        schema:
          type: string
        example: <string>
        description: 'Unique Id of the lead. '
      - name: postUpdatedLead
        in: query
        required: false
        schema:
          type: string
        example: <boolean>
        description: 'If you have configured automation, webhooks or rules & notifications
          based on lead Update, they won’t trigger by default if a lead is updated
          via this API. If you want them to trigger, pass an additional parameter
          “postUpdatedLead=true”. '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  Attribute:
                    type: string
                    description: The schema name of the lead fields you want to update.
                      To retrieve the schema name use the Get Metadata API.
                  Value:
                    type: string
                    description: The new value of the lead field.
                required:
                - Attribute
                - Value
            example:
            - Attribute: Phone
              Value: '9732172291'
            - Attribute: mx_City
              Value: London
      security:
      - APIKey: []
        AccessKey: []
        SecretKey: []
  /lead/update/status:
    get:
      summary: Update a Lead Status API
