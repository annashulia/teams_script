        \  [&nbsp;](https://apidocs.leadsquared.com/capture-leads-async/)–\n\n- `PendingMessages`\
        \ – The approximate number of pending requests in the queue.\n    \n- `MaxDelayInSeconds`\
        \ – The maximum delay (in seconds) for processing all requests in the queue.\n\
        \    \n- `ProcessingRatePerMinute` – Number of requests being processed per\
