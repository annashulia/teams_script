                  Status: Success
                  StatusReason: Request was successfully completed
                  TaskCurrentStep: null
                  TaskLastStep: In-Process-Queue
                  RequestBody: "[\r\n    {\r\n        \"Attribute\": \"Phone\",\r\n\
                    \        \"Value\": \"9732172291\"\r\n    },\r\n    {\r\n    \
                    \    \"Attribute\": \"mx_City\",\r\n        \"Value\": \"London\"\
                    \r\n    }\r\n]\n"
                  Message: '{"Status":"Success","Message":{"AffectedRows":1}}'
      description: 'Returns the status of the [async lead update](https://www.postman.com/leadsquaredapi/leadsquared-public-apis/request/jprzz0s/update-a-lead-async?action=share&source=copy-link&creator=39502170&ctx=documentation)
