                  Value: '2025-02-11 12:13:44'
                - SchemaName: mx_Custom_14
                  Value: ''
                  Fields:
                  - SchemaName: mx_CustomObject_1
                    Value: e11e192f.jpg
                  - SchemaName: mx_CustomObject_3
                    Value: 85d25e7e.png
