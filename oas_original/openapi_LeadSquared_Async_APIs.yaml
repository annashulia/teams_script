  /activity/create:
    post:
      summary: Post an Activity on a Lead (Async)
      operationId: post_an_activity_on_a_lead_async
      tags:
      - LeadSquared Async
      responses:
        '200':
          description: New Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    type: string
                    description: A message confirming if the request was accepted
                      successfully.
                  RequestID:
                    type: string
                    description: A unique identifier assigned to the submitted request.
                      Use this ID to track or check the status of the request.
              example:
                Status: Request accepted. Please use below request id to check the
                  status
                RequestID: 3977a338-7896-4370-a286-417476a5380e
      description: "Posts an activity on a lead.\n\n**Note:**\n\n- Take a look at\
        \ [synchronous Post Activity on Lead API](https://www.postman.com/leadsquaredapi/leadsquared-public-apis/request/xcg7tdn/post-an-activity-on-a-lead?action=share&source=copy-link&creator=39502170&ctx=documentation)\
        \ for the functioanlity of the API and documentation on the payload.\n   \
        \ \n- This API returns a `RequestId` parameter in the response. This must\
        \ be passed in the [Status API](https://www.postman.com/leadsquaredapi/leadsquared-public-apis/request/wsaq3mp/post-an-activity-on-a-lead-status-api?action=share&source=copy-link&creator=39502170&ctx=documentation)\
        \ to get the status of the request.\n    \n- To get metrics for this Async\
        \ API, see [Get Post Activity on Lead Metrics API](https://www.postman.com/leadsquaredapi/leadsquared-public-apis/request/bubv01v/get-post-activity-on-lead-metrics?action=share&source=copy-link&creator=39502170&ctx=documentation)."
      parameters:
      - name: accessKey
        in: query
        required: true
        schema:
          type: string
        example: '{{AccessKey}}'
        description: The `accessKey` can be obtained on your LeadSquared dashboard.
          Navigate to **My Account>Settings>API and Webhooks section**.
      - name: secretKey
        in: query
        required: true
        schema:
          type: string
        example: '{{SecretKey}}'
        description: The secretKey can be obtained on your LeadSquared dashboard.
          Navigate to **My Account>Settings>API and Webhooks section**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                RelatedProspectId:
                  type: string
                  description: Id (`ProspectId`) of the lead you want to post the
                    activity on.
                ActivityEvent:
                  type: integer
                  description: Activity event code.
                ActivityNote:
                  type: string
                  description: Activity note.
                ProcessFilesAsync:
                  type: boolean
                ActivityDateTime:
                  type: string
                  description: Activity date and time in `yyyy-mm-dd hh:mm:ss` format.
                Fields:
                  type: array
                  items:
                    type: object
                    properties:
                      SchemaName:
                        type: string
                      Value:
                        type: string
                  description: "The activity fields you want to update. Pass the fields\
                    \ as attribute-value pairs, by mentioning the “Schema Names” and\
                    \ values.  \n  \nTo find the “Schema Names” to a custom activity,\
                    \ navigate to **My Profile>Settings>Leads>Activities and Scores>Custom\
                    \ Activities & Scores**. Against the activity type, click the\
                    \ edit icon, and then click Edit."
              required:
              - ActivityEvent
              - Fields
            example:
              RelatedProspectId: 6f2195dc-e36d-4074-9e2e-e40911c11c42
              ActivityEvent: 201
              ActivityNote: Payment
              ProcessFilesAsync: true
              ActivityDateTime: '2025-02-10 12:13:44'
              Fields:
              - SchemaName: mx_Custom_1
                Value: '20000'
              - SchemaName: mx_Custom_2
                Value: UPF35B1
              - SchemaName: mx_Custom_3
                Value: Rupees
      security:
      - APIKey: []
        AccessKey: []
        SecretKey: []
  /activity/create/status:
