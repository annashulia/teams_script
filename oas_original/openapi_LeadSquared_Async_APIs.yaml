  /opportunity/update/status:
    get:
      summary: Update an Opportunity Status API
      operationId: update_an_opportunity_status_api
      tags:
      - LeadSquared Async
      responses:
        '200':
          description: New Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  RequestId:
                    type: string
                    description: ID of the request.
                  TaskStatus:
                    type: object
                    properties:
                      TaskType:
                        type: string
                        description: The task type related to the request (for example,
                          "Opportunity Update").
                      Status:
                        type: string
                        description: The status of the task. Possible values are "Success"
                          or "Error".
                      StatusReason:
                        type: string
                        description: Provides the reason for the status. If successful,
                          "Request was successfully completed" is returned; otherwise,
                          the error reason is returned.
                      TaskCurrentStep:
                        type: string
                        nullable: true
                        description: The current step the request is in.
                      TaskLastStep:
                        type: string
                        description: The previous step completed by the request.
                      RequestBody:
                        type: string
                        description: The body passed in the Async API request.
                      Message:
                        type: string
                        description: If successful, the response data for the original
                          API request is returned; otherwise, null is returned.
              example:
                RequestId: baf8b843-211b-4678-82c5-af28906d4998
                TaskStatus:
                  TaskType: Opportunity Update
                  Status: Success
                  StatusReason: Request was successfully completed
                  TaskCurrentStep: null
                  TaskLastStep: In-Process-Queue
                  RequestBody: "{\r\n    \"ProspectOpportunityId\": \"25b98314-c576-4145-bd97-d6e443f3de50\"\
                    ,\r\n    \"OpportunityNote\": \"Update note\",\r\n    \"Fields\"\
                    : [\r\n        {\r\n            \"SchemaName\": \"mx_Custom_7\"\
                    ,\r\n            \"Value\": \"201,000\"\r\n        },\r\n    \
                    \    {\r\n            \"SchemaName\": \"mx_Custom_9\",\r\n   \
                    \         \"Value\": \"2025-02-11 12:13:44\"\r\n        }\r\n\
                    \    ]\r\n}"
                  Message: '{"Status":"Success","Message":{"Id":"25b98314-c576-4145-bd97-d6e443f3de50"}}'
      description: 'Returns the status of the [async opportunity update request](https://www.postman.com/leadsquaredapi/leadsquared-public-apis/request/mu7ohzu/update-an-opportunity-async?action=share&source=copy-link&creator=39502170&ctx=documentation).


        ## Response Parameters


        | **Parameter** | **Description** | **Data Type** |

        | --- | --- | --- |

        | `RequestId` | ID of the request. | `String` |

        | `TaskType` | The task type related to the request. For example, “Opportunity
        Update”. | `String` |

        | `Status` | The status of the task. Returned values are “Success” or “Error”.
        | `String` |

        | `StatusReason` | Text explaining the reason for the above status. If “Success”,
        then “Request was successfully completed” is returned; otherwise, error reason
        is returned. | `String` |

        | `TaskCurrentStep` | Current step the request is in. | `Enum` |

        | `TaskLastStep` | Previous step the request completed. | `Enum` |

        | `RequestBody` | The body that was passed in the Async API request. | `Object`
        |

        | `Message` | If successful, response data for the original API request is
        returned; otherwise null is returned. | `Object` |'
      parameters:
      - name: RequestID
        in: query
        required: true
        schema:
          type: string
        example: <string>
        description: Pass the RequestId value returned by the Update an Opportunity
          (Async) API.
      x-readme: {}
