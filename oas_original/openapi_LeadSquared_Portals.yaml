                      `PortalId` (e.g., `apply.lsqportal.com?leadId=&portalId=&authKey=`)
                      and share it with the lead (e.g., via email, SMS, etc.).


                      The auth key will have 4 hours of default expiration time. To
                      change this duration, contact your account manager.

                      '
                  LeadId:
                    type: string
                    description: The unique identifier of the lead.
              example:
                AuthKey: 
                LeadId: d17f0128-8ea2-4828-a284-3432052913ec
      description: "This API generates the Lead private token for particular Portal.\n\
        \n**Note:**\n\n- The response returns an alpha-numeric auth key. Append this\
        \ auth key to the target portal page URL along with the `LeadId` and `PortalId`\
        \ (e.g., `apply.lsqportal.com?leadId=&portalId=&authKey=`) and share it with\
        \ the lead (e.g., via email, SMS, etc.).\n    \n- The auth key will have 4\
        \ hours of default expiration time. To change this duration, contact your\
        \ account manager.\n    \n\n## Payload\n\n| **Parameter** | **Description**\
        \ | **Data Type** | **Required** |\n| --- | --- | --- | --- |\n| `LeadId`\
        \ | Use any of the Retrieve Lead APIs to get the LeadId. | `String` | Yes\
        \ |\n| `PortalId` | You can obtain the portal Id by accessing your LeadSquared\
        \ account and navigating to Workflow>Manage Portals, select a portal and copy\
        \ the portal Id from the page URL. | `String` | Yes |"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                LeadId:
                  type: string
                  description: Use any of the Retrieve Lead APIs to get the LeadId.
                PortalId:
                  type: string
                  description: You can obtain the portal Id by accessing your LeadSquared
                    account and navigating to `Workflow>Manage Portals`, select a
