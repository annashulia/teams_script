  /api/Widget/Retrieve:
    post:
      summary: Retrieve Widgets
      operationId: retrieve_widgets
      tags:
      - Widgets
      responses:
        '200':
          description: Retrieve Widgets
          content:
            application/json:
              schema:
                type: object
                properties:
                  TotalRecords:
                    type: integer
                    description: The total number of widgets returned in the response.
                  WidgetList:
                    type: array
                    items:
                      type: object
                      properties:
                        Id:
                          type: string
                          description: The unique identifier of the widget.
                        Name:
                          type: string
                          description: The display name of the widget.
                        Description:
                          type: string
                          description: A brief description of the widget. Returns
                            an empty string if no description is set.
                    description: A list of widget objects associated with the portal.
              example:
                TotalRecords: 2
                WidgetList:
                - Id: 7bda1ee6-5c4d-11ee
                  Name: Uni Widget
                  Description: ''
                - Id: f0600e64-56bd-11ee
                  Name: University Widget
                  Description: ''
      description: "Retrieves the LeadSquared Widget details of one or more widgets\
        \ (Widget Id, Name, and Description).\n\n> Note: You must [use the correct\
        \ API host](https://www.postman.com/leadsquaredapi/workspace/leadsquared-public-apis/folder/39502170-790c0633-8cec-4d5e-8f5b-14a01fea8fd1?action=share&creator=39502170&ctx=documentation&active-environment=39502170-a39a29d0-f0e1-4be8-9191-f01bd917feb4)\
        \ to make successful calls. \n  \n\n## Payload\n\nAll request parameters are\
        \ **non-mandatory**. If you pass an empty payload, then all the widgets available\
        \ in the manage widgets page will be retrieved.\n\n| Parameter | Description\
        \ | **Data Type** | **Required** |\n| --- | --- | --- | --- |\n| `SearchText`\
        \ | Retrieves widgets based on any string you pass. The string can be the\
        \ widget name or description. | `String` | No |\n| `StatusCode` | Lets you\
        \ retrieve widgets by status –  <br>  <br>\\- `0` represents unpublished widgets\
        \  <br>  <br>\\- `1` represents published widgets | `Integer` | No |\n| `PageIndex`\
        \ & `PageSize` | The results matching your criteria may be large. You can\
        \ fetch the result in blocks of “PageSize” and make multiple calls to the\
        \ API with increasing values of “PageIndex”. For example, you can specify\
        \ “PageIndex”: 1, “PageSize”: 100 for the first call and specify “PageIndex”:\
        \ 2, “PageSize”: 100 for second call. | `Integer` | No |"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Parameter:
                  type: object
                  properties:
                    SearchText:
                      type: string
                      description: Retrieves widgets based on any string you pass.
                        The string can be the widget name or description.
                    StatusCode:
                      type: string
                      description: "Lets you retrieve widgets by status –  \n  \n\
                        - `0` represents unpublished widgets  \n  \n- `1` represents\
                        \ published widgets"
                Paging:
                  type: object
                  properties:
                    PageIndex:
                      type: integer
                    PageSize:
                      type: integer
                  description: 'The results matching your criteria may be large. You
                    can fetch the result in blocks of `PageSize` and make multiple
                    calls to the API with increasing values of `PageIndex`. For example,
                    you can specify `“PageIndex”: 1, “PageSize”: 100` for the first
                    call and specify `“PageIndex”: 2, “PageSize”: 100` for second
                    call.'
            example:
              Parameter:
                SearchText: Uni
                StatusCode: '1'
              Paging:
                PageIndex: 1
                PageSize: 25
      security:
      - AccessKey: []
        SecretKey: []
