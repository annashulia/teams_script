      responses:
        '200':
          description: Portal Auto Login – Generate Lead-Level Auth Key
          content:
            application/json:
              schema:
                type: object
                properties:
                  AuthKey:
                    type: string
                    description: 'Thus is an alpha-numeric auth key. Append this auth
