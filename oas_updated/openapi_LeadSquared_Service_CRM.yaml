                                \ \n  \n- `notin`: Opposite of in (use a stringified\
                                \ array). Example: status notin “[\\”open\\”, \\”closed\\\
                                ”]”. \n  \n- `between`: Checks if a field falls within\
                                \ a range (dates or integers). Example: CreatedOn\
