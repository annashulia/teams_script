      description: "Lets you retrieve [Tickets](https://help.leadsquared.com/service-crm/ticket-fields-and-form-configuration/)\
        \ using the [advanced search](https://help.leadsquared.com/service-crm/service-agent-ticket-views#advancedSearch)\
        \ criteria.\n\n**Note:** This API can only be passed by Admin users.\n\n##\
        \ **Prerequisite**\n\nBefore you pass this API, the API Configurations setting\
        \ must be enabled on your account. To do this –\n\n1. On your LeadSquared\
        \ account, navigate to [My Profile&gt;Settings&gt;Service Cloud](https://in21.leadsquared.com/a/ServiceCloud),\
        \ and click **API Configurations**.\n    \n2. Alongside **Enable API**, enable\
        \ the slider .\n    \n    - Alongside **Enable IP Whitelisting**, enable the\
        \ slider and add the IPs you want to whitelist. This is optional.\n      \
        \  \n3. Once you’re done, click **Save**.\n    \n\n**Note:**\n\n- To obtain\
        \ the host API URL, contact your account manager, or write to [scsupport@leadsquared.com](https://mailto:scsupport@leadsquared.com).\n\
        \    \n- You can find the org ID after logging into your [LeadSquared account](https://login.leadsquared.com/Home/).\n\
        \    \n\n## Payload\n\n| Parameter | Description | **Data Type** | **Required**\
        \ |\n| --- | --- | --- | --- |\n| `GroupConditionOperator` | The operator\
        \ for all the conditions listed within this object. You can pass AND or OR.\
        \ | `String` | Pass AND or OR. |\n| `ConditionOperator` | The operator for\
        \ the individual condition. You can pass AND or OR. | `String` | Pass AND\
        \ or OR. |\n| `Conditions` | The list of advance search conditions. | See\
        \ below | No |\n| `Type` | Pass `ticket`. | `String` | Yes |\n| `FieldName`\
        \ | Pass the schema name of the ticket field you want to retrieve. You can\
        \ retrieve system and custom fields. To find the schema name, refer to [Ticket\
        \ Fields Configuration](https://help.leadsquared.com/service-crm/ticket-fields-and-form-configuration#settings).\
        \  <br>  <br>**Note:** If you’re passing a custom field, prefix its name with\
        \ `CustomData.` For example, in the image below, the schema name for the “Request\
        \ Type” field is **SRC_CS_2**, and we’re passing it as `CustomData.SRC_CS_2`\
        \ | `String` | Yes |\n| `Operator` | The following operators are supported\
        \ –  <br>  <br>\\- **after**: For dates and integer fields.  <br>  <br>\\\
        - **before**: For dates and integer fields  <br>  <br>\\- **contains**: For\
        \ wildcard searches.  <br>  <br>\\- **endswith**: Checks if a field ends with\
        \ a specific value.  <br>Example: Title endswith ‘escalation’  <br>  <br>\\\
        - **equals**: Matches a field’s value.  <br>Example: status equals ‘open’\
        \  <br>  <br>\\- **gte**: Greater than or equal to.  <br>Example: CreatedOn\
        \ gte ‘2025-01-15’  <br>  <br>\\- **in**: For multi-select values (use a stringified\
        \ array).  <br>Example: status in “\\[\\\\”open\\\\”, \\\\”closed\\\\”\\]”\
        \  <br>  <br>\\- **isdefined**: Checks if a field contains data.  <br>Example:\
        \ RelatedAgentId isdefined  <br>  <br>\\- **isfalse**: Checks if a field’s\
        \ value is false.  <br>Example: Deleted isfalse  <br>  <br>\\- **notdefined**:\
        \ Checks if a field doesn’t contain data.  <br>Example: RelatedAgentId notdefined\
        \  <br>  <br>\\- **istrue**: Checks if a field’s value is true.  <br>Example:\
        \ Deleted istrue  <br>  <br>\\- **lte**: Less than or equal to (similar to\
        \ `gte`).  <br>Example: CreatedOn lte ‘2025-01-16’  <br>  <br>\\- **notcontains**:\
        \ Checks if a field doesn’t contain a specific value.  <br>Example: Title\
        \ notcontains ‘escalation’  <br>  <br>\\- **notequal**: Checks if a field\
        \ is not equal to a specific value.  <br>Example: status notequal ‘closed’\
        \  <br>  <br>\\- **notin**: Opposite of `in` (use a stringified array).  <br>Example:\
        \ status notin “\\[\\\\”open\\\\”, \\\\”closed\\\\”\\]”  <br>  <br>\\- **between**:\
        \ Checks if a field falls within a range (dates or integers).  <br>Example:\
        \ CreatedOn between “2025-01-14T18:30:00ZTO2025-01-15T18:29:59Z”  <br>  <br>\\\
        - **startswith**: Checks if a field starts with a specific value.  <br>Example:\
        \ Title startswith ‘Query’ | `String` | Yes |\n| `Value` | Pass the value\
        \ of the ticket. For example 'Open' | `String` | Yes |\n| `Offset` | Pass\
        \ ‘0’. | `Integer` | No |\n| `Limit` | Pass ’10’. | `Integer` | No |\n| `Sort`\
        \ | Tickets are sorted by **CreatedOn** date by default. You can specify the\
        \ schema names of other date-time fields as well. Pass `ASC` for ascending\
        \ or `DESC` for descending. | `String` | No |\n| `SearchText` | Used for basic\
        \ search queries. This can be blank. | `String` | No |"
      parameters:
      - name: scopeFilter
        in: query
        required: true
        schema:
          type: string
        example: '{{scopeFilter}}'
        description: "Pass one of the following headers to retrieve tickets matching\
          \ the conditions in your payload.  \n- ALL_TICKETS \n- UNASSIGNED_TICKETS\
          \ \n- GROUP_TICKETS \n- MY_TICKETS"
      - name: orgID
        in: path
        required: true
        schema:
          type: string
        description: You can find the org ID on the profile settings drop down, after
          logging into your LeadSquared account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                AdvanceSearchFilters:
                  type: array
                  items:
                    type: object
                    properties:
                      GroupConditionOperator:
                        type: string
