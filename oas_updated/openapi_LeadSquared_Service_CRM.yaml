                              description: "The following operators are supported\
                                \ –  \n  \n- `after`: For dates and integer fields.\
                                \  \n  \n- `before`: For dates and integer fields\
                                \  \n  \n- `contains`: For wildcard searches.  \n\
                                \  \n- `endswith`: Checks if a field ends with a specific\
                                \ value.  Example: Title endswith ‘escalation’.  \n\
                                \  \n- `equals`: Matches a field’s value. Example:\
                                \ status equals ‘open’.\n  \n- `gte`: Greater than\
                                \ or equal to. Example: CreatedOn gte ‘2025-01-15’.\n\
                                \  \n- `in`: For multi-select values (use a stringified\
                                \ array). Example: status in “[\\”open\\”, \\”closed\\\
                                ”]”.  \n  \n- `isdefined`: Checks if a field contains\
                                \ data. Example: RelatedAgentId isdefined.\n  \n-\
                                \ `isfalse`: Checks if a field’s value is false. Example:\
                                \ Deleted isfalse.\n  \n- `notdefined`: Checks if\
                                \ a field doesn’t contain data. Example: RelatedAgentId\
                                \ notdefined. \n  \n- `istrue`: Checks if a field’s\
                                \ value is true. Example: Deleted istrue.  \n  \n\
                                - `lte`: Less than or equal to (similar to gte). Example:\
