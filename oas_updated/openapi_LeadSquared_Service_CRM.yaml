      description: "Lets you fetch the details of an existing ticket from [LeadSquared’s\
        \ Service CRM platform](https://help.leadsquared.com/service-crm/service-crm-feature-overview/).\
        \ This API returns the details of a single ticket (Associated Lead ID, Ticket\
        \ Status, etc.) based on the `TicketNumber` you pass in the API URL.\n\nTo\
        \ obtain the `TicketNumber`, navigate to the [Ticket Details Page](https://help.leadsquared.com/service-crm/service-agent-ticket-details-page/),\
        \ and copy the number from the page.\n\n<img src=\"https://content.pstmn.io/746bb873-8c35-4f23-83f0-0dc10a71d787/aW1hZ2UucG5n\"\
        \ width=\"1921\" height=\"826\">\n\n## Prerequisite\n\nBefore you pass this\
        \ API, the API Configurations setting must be enabled on your account. To\
        \ do this –\n\n1. On your LeadSquared account, navigate to [My Profile&gt;Settings&gt;Service\
        \ Cloud](https://in21.leadsquared.com/a/ServiceCloud), and click **API Configurations**.\n\
        \    \n2. Alongside **Enable API**, enable the slider.\n    \n    1. Alongside\
        \ **Enable IP Whitelisting**, enable the slider and add the IPs you want to\
        \ whitelist. This is optional.\n        \n3. Once you’re done, click **Save**.\n\
        \    \n\n**Note:**\n\n- To obtain the host API URL, contact your account manager,\
        \ or write to [scsupport@leadsquared.com](https://mailto:scsupport@leadsquared.com).\n\
        \    \n- You can find the org ID after logging into your [LeadSquared account](https://login.leadsquared.com/Home/)."
