paths:
  /api/tenants/{orgID}/tickets:
    post:
      summary: Create Tickets
      operationId: create-tickets
      tags:
      - Root
      responses:
        '200':
          description: Create Tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    type: string
                    description: The overall result of the request. Returns `Success`
                      when the ticket is created successfully.
                  ReasonForFailure:
                    type: string
                    nullable: true
                    description: Describes the reason for failure if the request was
                      unsuccessful. Returns `null` on success.
                  Id:
                    type: string
                    description: The auto-incremented numeric identifier assigned
                      to the ticket.
                  Message:
                    type: string
                    description: A status message indicating the result of the request.
                      Returns `Ticket has been created successfully` on success.
                  Key:
                    type: string
                    description: 'The ticket''s reference number (e.g., #160).'
                  TicketId:
                    type: string
                    description: The unique identifier of the created ticket.
              example:
                Status: Success
                ReasonForFailure: null
                Id: '160'
                Message: Ticket has been created successfully
                Key: '#160'
                TicketId: 23066149-a8a3-497c-a479-4ce6fc18b5a4
      description: "Lets you create a new ticket in [LeadSquared’s Service CRM platform](https://help.leadsquared.com/service-crm/service-crm-feature-overview/).\n\
        \nYou can pass as many ticket fields (including custom fields) as you want,\
        \ but it is mandatory to pass at least one of the following lead fields –\n\
        \n- LeadDetail.EmailAddress\n    \n- LeadId\n    \n- LeadDetail.Phone\n  \
        \  \n\n## Prerequisite\n\nBefore you pass this API, the API Configurations\
        \ setting must be enabled on your account. To do this –\n\n1. On your LeadSquared\
        \ account, navigate to [My Profile&gt;Settings&gt;Service Cloud](https://in21.leadsquared.com/a/ServiceCloud),\
        \ and click **API Configurations**.\n    \n2. Alongside **Enable API**, enable\
        \ the slider.\n    \n    1. Alongside **Enable IP Whitelisting**, enable the\
        \ slider and add the IPs you want to whitelist. This is optional.\n      \
        \  \n3. Once you’re done, click **Save**.\n    \n\n**Note:**\n\n- To obtain\
        \ the host API URL, contact your account manager, or write to [scsupport@leadsquared.com](https://mailto:scsupport@leadsquared.com).\n\
        \    \n- You can find the org ID after logging into your [LeadSquared account](https://login.leadsquared.com/Home/).\n\
        \    \n\n## Payload\n\n| **Parameter** | **Description** | **Data Type** |\
        \ **Required** |\n| --- | --- | --- | --- |\n| `TypeId` | Specifies the ticket\
        \ type. Pass 1 by default. | `String` | Yes |\n| `Id` | Pass `null`. | `null`\
        \ | Yes |\n| `Fields` | Pass the schema names of the system and custom ticket\
        \ and lead fields, along with their corresponding values.  <br>  <br>You must\
        \ include all the mandatory ticket fields configured in your account. Additionally,\
        \ you must also include one of the following lead fields –  <br>  <br>`EmailAddress`\
        \ – The lead’s email address.  <br>  <br>`LeadID` – The lead’s unique Id.\
        \ To obtain this Id, refer to Get a Lead by Email or Get a Lead by Phone Number.\
        \  <br>  <br>`LeadDetail.Phone` – The lead’s phone number. | `String` | Yes\
        \ |\n| `RelatedTicketTypeId` | Specifies the ticket type.  <br>  <br>Pass\
        \ 1 by default. | `Integer` | Yes |"
      parameters:
      - name: orgID
        in: path
        required: true
        schema:
          type: string
        description: You can find the org ID in the profile dropdown after logging
          into your LeadSquared account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                TypeId:
                  type: string
                  description: Specifies the ticket type. Pass 1 by default.
                Id:
                  type: string
                  nullable: true
                  description: Pass null.
                LeadId:
                  type: string
                  description: 'The lead’s unique Id. To obtain this Id, refer to
                    Get a Lead by Email or Get a Lead by Phone Number.  '
                Fields:
                  type: array
                  items:
                    type: object
                    properties:
                      SchemaName:
                        type: string
                      Value:
                        type: string
                  description: "Pass the schema names of the system and custom ticket\
                    \ and lead fields, along with their corresponding values.  \n\
                    \  \nYou must include all the mandatory ticket fields configured\
                    \ in your account. Additionally, you must also include one of\
                    \ the following lead fields –  \n  \n`EmailAddress` – The lead’s\
                    \ email address.  \n  \n`LeadID` – The lead’s unique Id. To obtain\
                    \ this Id, refer to Get a Lead by Email or Get a Lead by Phone\
                    \ Number.  \n  \n`LeadDetail.Phone` – The lead’s phone number."
                RelatedTicketTypeId:
                  type: integer
                  description: "Specifies the ticket type.  \n  \nPass 1 by default."
              required:
              - TypeId
              - Id
              - RelatedTicketTypeId
              - LeadId
            example:
              TypeId: '1'
              Id: null
              LeadId: 45b5fded-e696-45a6-9fbb-c6a
              Fields:
              - SchemaName: Title
                Value: Test ticket from API
              - SchemaName: RelatedCustomerId
                Value: 45b5fded-e696-45a6-9fbb-c6af6
              - SchemaName: Description
                Value: Test ticket from External API
              - SchemaName: Type
                Value: General
              - SchemaName: Status
                Value: Open
              - SchemaName: Priority
                Value: Low
              - SchemaName: Channel
                Value: Chat
              RelatedTicketTypeId: 1
