        \ pass the `LeadId`. To obtain this, pass the [Get a Lead by Email API](https://www.postman.com/leadsquaredapi/workspace/leadsquared-public-apis/request/39502170-bcad0801-773c-4b28-a314-ae6018845697?action=share&source=copy-link&creator=39502170&ctx=documentation).\
        \  <br>  <br>For a lead that’s not present in LeadSquared, pass this array\
        \ with relevant details. This should mandatorily include one lead identifier\
        \ (like Email, Phone, etc.) –  <br>  <br>`[ { \"SchemaName\":\"LeadDetail.Phone\"\
        , \"Value\":\"\" }, { \"SchemaName\":\"LeadDetail.EmailAddress\", \"Value\"\
        :\"`[<code>wim@example.com</code>](https://mailto:wim@example.com)`\" }, {\
        \ \"SchemaName\":\"LeadDetail.Mobile\", \"Value\":\"\" }, { \"SchemaName\"\
        :\" \", \"Value\":\"\" } ]` | `String` | Yes |\n| `Fields` | Pass the following\
        \ ticket fields, along with their values.  <br>\\- Title  <br>\\- Status\\\
        *  <br>\\- Priority\\*  <br>\\- Channel\\*  <br>\\- Description  <br>\\- Schema\
        \ name of a custom ticket field | `String` | Only fields marked (\\*) in the\
        \ description are mandatory. Rest are optional. |\n| `RelatedTicketTypeId`\
        \ | Pass `1` | `Integer` | Yes |\n| `Files` | Attach a file from your local\
